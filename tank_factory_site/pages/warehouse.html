<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Склад - Tank Factory Simulation</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="warehouse" class="page-scroll">
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Tank Factory Simulation</h1>
      <p>Цех № 19 - сборка танков</p>
    </div>
    <nav class="nav">
      <a href="../index.html">Симуляция</a>
      <a href="blueprints.html">Чертежи</a>
      <a href="warehouse.html" class="active">Склад</a>
    </nav>
    <button type="button" id="burger" class="burger" aria-label="Меню" aria-expanded="false">☰</button>
    <nav id="mobile-menu" class="mobile-menu">
      <a href="../index.html">Симуляция</a>
      <a href="blueprints.html">Чертежи</a>
      <a href="warehouse.html">Склад</a>
    </nav>
  </header>

  <main class="layout single">
    <section class="panel store full">
      <h2>Склад готовой продукции</h2>
      <p class="total">Всего танков: <b id="store-total">0</b></p>
      <h3>По чертежам</h3>
      <ul id="store-groups" class="groups"></ul>
      <h3>Журнал выпуска</h3>
      <ol id="store-list" class="store-list"></ol>
      <p id="store-empty" class="hint">Склад пуст. Соберите танк на странице <a href="../index.html">Симуляция</a>.</p>
      <button type="button" id="store-clear">Очистить склад</button>
    </section>
  </main>

  <footer class="bottom">Вариант 19 - ЛР 7</footer>
</div>
  <script type="module" src="../js/site.js"></script>
</body>
</html>
