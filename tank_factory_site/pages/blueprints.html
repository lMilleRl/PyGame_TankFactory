<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чертежи - Tank Factory Simulation</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../../tank_blueprints/css/crud.css">
</head>
<body data-page="blueprints" class="page-scroll">
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Tank Factory Simulation</h1>
      <p>Цех № 19 - сборка танков</p>
    </div>
    <nav class="nav">
      <a href="../index.html">Симуляция</a>
      <a href="blueprints.html" class="active">Чертежи</a>
      <a href="warehouse.html">Склад</a>
    </nav>
    <button type="button" id="burger" class="burger" aria-label="Меню" aria-expanded="false">☰</button>
    <nav id="mobile-menu" class="mobile-menu">
      <a href="../index.html">Симуляция</a>
      <a href="blueprints.html">Чертежи</a>
      <a href="warehouse.html">Склад</a>
    </nav>
  </header>
  <main class="crud">
    <section class="box">
      <h2>Новый чертёж</h2>
      <form id="form" novalidate>
        <label class="field">
          <span>Название танка</span>
          <input id="name" name="name" type="text" maxlength="40" required autocomplete="off">
          <span class="error" id="name-error"></span>
        </label>

        <fieldset class="field">
          <legend>Необходимые детали</legend>
          <label class="check"><input type="checkbox" value="chassis"><span class="icon chassis"></span>шасси</label>
          <label class="check"><input type="checkbox" value="turret"><span class="icon turret"></span>башня</label>
          <label class="check"><input type="checkbox" value="cannon"><span class="icon cannon"></span>орудие</label>
        </fieldset>

        <div class="field">
          <span>Порядок соединения</span>
          <ol id="order" class="order"></ol>
          <p id="order-empty" class="hint">Отметьте детали выше</p>
          <span class="error" id="parts-error"></span>
        </div>

        <button type="submit">Создать</button>
      </form>
    </section>

    <section class="box wide">
      <h2>Чертежи <span id="count" class="count">0</span></h2>
      <div class="filters">
        <label>Поиск <input id="search" type="search" placeholder="название"></label>
        <label>Деталей ≤ <output id="filter-val">3</output>
          <input id="filter-parts" type="range" min="1" max="3" value="3">
        </label>
      </div>
      <table id="blueprints" class="list">
        <thead>
          <tr><th>№</th><th>Название</th><th>Деталей</th><th>Порядок сборки</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="list-empty" class="hint" hidden>Ничего не найдено</p>
    </section>
  </main>

  <footer class="bottom">Вариант 19 - ЛР 7</footer>
</div>
  <script type="module" src="../js/site.js"></script>
  <script type="module" src="../../tank_blueprints/js/crud.js"></script>
</body>
</html>
